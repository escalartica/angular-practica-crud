<div class="table-container p-4">
  <h1 class="text-2xl font-bold mb-4">Lista de Coches</h1>
  <table class="min-w-full table-auto border-collapse bg-white shadow-md rounded-lg overflow-hidden">
    <thead class="bg-gray-100">
      <tr>
        <th class="py-2 px-4 text-left text-sm font-semibold text-gray-700 border-b">ID</th>
        <th class="py-2 px-4 text-left text-sm font-semibold text-gray-700 border-b">Marca</th>
        <th class="py-2 px-4 text-left text-sm font-semibold text-gray-700 border-b">Modelo</th>
        <th class="py-2 px-4 text-left text-sm font-semibold text-gray-700 border-b">Total</th>
        <th class="py-2 px-4 text-left text-sm font-semibold text-gray-700 border-b">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let car of cars" class="border-b hover:bg-gray-50">
        <td class="py-2 px-4 text-sm text-gray-800">{{ car.id }}</td>
        <td class="py-2 px-4 text-sm text-gray-800">{{ car.marca }}</td>
        <td class="py-2 px-4 text-sm text-gray-800">{{ car.modelo }}</td>
        <td class="py-2 px-4 text-sm text-gray-800">{{ car.total }}</td>
        <td class="py-2 px-4 text-sm">
          <button (click)="editCar(car.id)" class="bg-blue-500 text-white py-1 px-4 rounded hover:bg-blue-600 focus:outline-none">Edit</button>
          <button (click)="deleteCar(car.id)" class="bg-red-500 text-white py-1 px-4 rounded hover:bg-red-600 focus:outline-none ml-2">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
