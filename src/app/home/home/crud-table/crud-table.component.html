<!-- Tabla de Material Design -->
<table mat-table [dataSource]="cars">
  <!-- Definir las columnas -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let car"> {{ car.id }} </td>
  </ng-container>

  <ng-container matColumnDef="marca">
    <th mat-header-cell *matHeaderCellDef> Marca </th>
    <td mat-cell *matCellDef="let car"> {{ car.marca }} </td>
  </ng-container>

  <ng-container matColumnDef="modelo">
    <th mat-header-cell *matHeaderCellDef> Modelo </th>
    <td mat-cell *matCellDef="let car"> {{ car.modelo }} </td>
  </ng-container>

  <ng-container matColumnDef="total">
    <th mat-header-cell *matHeaderCellDef> Total </th>
    <td mat-cell *matCellDef="let car"> {{ car.total }} </td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef> Acciones </th>
    <td mat-cell *matCellDef="let car">
      <!-- Botón de menú de acción -->
      <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>more_vert</mat-icon>
      </button>
      <!-- Menú contextual con las opciones de acciones -->
      <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="viewDetails(car.id)">Ver</button>
        <button mat-menu-item (click)="editCar(car.id)">Editar</button>
        <button mat-menu-item (click)="deleteCar(car.id)">Eliminar</button>
      </mat-menu>
    </td>
  </ng-container>

  <!-- Definir la fila de cabecera y las filas de la tabla -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
